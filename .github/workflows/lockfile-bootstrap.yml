# Temporary one-shot dependency resolution using npm's authoritative lock generator.
# Do not keep this write-enabled workflow after #30 has a reviewed lockfile.
name: Bootstrap npm workspace lockfile (#30)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require lockfile absent
        run: test ! -e package-lock.json
      - name: Resolve workspace graph without executing lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify immutable installation and compile frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build --workspace @comuni/frontend
      - name: Commit only npm-generated lockfile directly on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          test -n "$(git diff --cached --name-only)"
          git commit -m 'build(frontend): lock npm workspace dependencies (#30)'
          git push origin HEAD:main
