name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1'

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: comuni_test
          POSTGRES_USER: comuni
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comuni -d comuni_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_CONNECTION: Host=127.0.0.1;Port=5432;Database=comuni_test;Username=comuni;Password=integration-only-password
      TEST_RUNTIME_DATABASE_CONNECTION: Host=127.0.0.1;Port=5432;Database=comuni_test;Username=comuni_app_runtime;Password=ci-test-runtime-only-password
      TEST_PLATFORM_DATABASE_CONNECTION: Host=127.0.0.1;Port=5432;Database=comuni_test;Username=comuni_platform_reader;Password=ci-only-platform-reader-password-not-production-2026
      Security__TenantProofKey: ci-test-only-hmac-key-for-comuni-rls-2026-11
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Domain and business tests
        run: dotnet test tests/backend/Comuni.UnitTests/Comuni.UnitTests.csproj --configuration Release
      - name: Run EF migrations with schema-owner credentials
        run: ConnectionStrings__Default="$TEST_DATABASE_CONNECTION" bash scripts/migrate.sh
      - name: Provision restricted PostgreSQL runtime user (twice for idempotence)
        env:
          PGPASSWORD: integration-only-password
          RUNTIME_DB_PASSWORD: ci-test-runtime-only-password
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U comuni -d comuni_test -f scripts/postgres/provision-runtime-role.sql
          psql -h 127.0.0.1 -U comuni -d comuni_test -f scripts/postgres/provision-runtime-role.sql
      - name: Provision separate platform inventory reader (twice for idempotence)
        env:
          PGPASSWORD: integration-only-password
          PLATFORM_READ_DB_PASSWORD: ci-only-platform-reader-password-not-production-2026
        run: |
          psql -h 127.0.0.1 -U comuni -d comuni_test -f scripts/postgres/provision-platform-read-role.sql
          psql -h 127.0.0.1 -U comuni -d comuni_test -f scripts/postgres/provision-platform-read-role.sql
      - name: Verify separate inventory SQL privileges from the owner session (read-only)
        env:
          PGPASSWORD: integration-only-password
        run: psql -X -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -U comuni -d comuni_test -f scripts/postgres/verify-platform-read-role.sql
      - name: Install signed tenant verification material (test-only secret)
        env:
          PGPASSWORD: integration-only-password
          TENANT_PROOF_KEY: ci-test-only-hmac-key-for-comuni-rls-2026-11
        run: psql -h 127.0.0.1 -U comuni -d comuni_test -f scripts/postgres/provision-tenant-proof.sql
      - name: Verify idempotent key staging and irreversible retirement (test-only)
        env:
          PGPASSWORD: integration-only-password
          TENANT_PROOF_KEY_ID: ci-rotate-v2
          TENANT_PROOF_KEY: ci-versioned-key-staging-only-2026-11
          TENANT_PROOF_RETIRE_KEY_ID: ci-rotate-v2
          TENANT_PROOF_REPLACEMENT_KEY_ID: legacy
          TENANT_PROOF_GRACE_SECONDS: "0"
        run: |
          psql -h 127.0.0.1 -U comuni -d comuni_test -f scripts/postgres/stage-tenant-proof-key.sql
          psql -h 127.0.0.1 -U comuni -d comuni_test -f scripts/postgres/stage-tenant-proof-key.sql
          psql -h 127.0.0.1 -U comuni -d comuni_test -f scripts/postgres/retire-tenant-proof-key.sql
          if env -u TENANT_PROOF_KEY psql -h 127.0.0.1 -U comuni -d comuni_test -f scripts/postgres/stage-tenant-proof-key.sql; then
            echo "ERROR: missing signing material did not fail" >&2
            exit 1
          fi
          if psql -h 127.0.0.1 -U comuni -d comuni_test -f scripts/postgres/stage-tenant-proof-key.sql; then
            echo "ERROR: a retired key was reactivated" >&2
            exit 1
          fi
      - name: API integration and isolation tests
        run: dotnet test tests/backend/Comuni.Api.Tests/Comuni.Api.Tests.csproj --configuration Release

  frontend:
    name: React build + Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build --workspace @comuni/frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @comuni/frontend
        env:
          CI: 'true'

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -recursive infra
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - name: Test Key Vault secret state boundary and preflight (no Azure)
        run: python3 -m unittest discover -s tests/infra -p 'test_*.py' -v

  # Blocking SCA: re-check live advisories even when source has not changed.
  dependency-audit:
    name: Dependency security (NuGet and npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Audit NuGet API and integration tests (direct and transitive)
        run: |
          dotnet restore tests/backend/Comuni.Api.Tests/Comuni.Api.Tests.csproj \
            -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high \
            -warnaserror:NU1900,NU1903,NU1904
      - name: Audit NuGet domain/unit tests (direct and transitive)
        run: |
          dotnet restore tests/backend/Comuni.UnitTests/Comuni.UnitTests.csproj \
            -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high \
            -warnaserror:NU1900,NU1903,NU1904
      - name: Install frontend dependencies for advisory resolution only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit npm runtime dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

  # CodeQL uploads findings to GitHub code scanning; alerts need human triage.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build_mode: manual
          - language: javascript-typescript
            build_mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - name: Build .NET API for C# extraction
        if: matrix.language == 'csharp'
        run: dotnet build src/backend/Applications/Api/Comuni.Api.csproj --configuration Release
      - name: Analyze and upload CodeQL results
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"

  container:
    name: Combined container image
    runs-on: ubuntu-latest
    needs: [backend, frontend, dependency-audit, codeql]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t comuni:ci .
