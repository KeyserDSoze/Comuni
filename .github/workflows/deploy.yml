name: Deploy to Azure
on:
  workflow_dispatch:
    inputs:
      enable_platform_inventory:
        description: "Stage read-only Superadmin inventory on the 0%-traffic candidate (external SQL role + pinned Key Vault secret required)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, push and apply Terraform
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_postgres_runtime_password: ${{ secrets.POSTGRES_RUNTIME_PASSWORD }}
      TF_VAR_tenant_proof_key_id: ${{ vars.TENANT_PROOF_KEY_ID }}
      # Only opt-in metadata. No platform-reader password or connection URI is
      # passed to Terraform; Key Vault resolves the pinned value in the API.
      TF_VAR_platform_inventory_enabled: ${{ inputs.enable_platform_inventory }}
      TF_VAR_platform_inventory_secret_version: ${{ vars.PLATFORM_INVENTORY_SECRET_VERSION }}
      TF_VAR_tenant_proof_secret_version: ${{ vars.TENANT_PROOF_SECRET_VERSION }}
      TF_VAR_stable_revision_suffix: ${{ vars.STABLE_REVISION_SUFFIX }}
      TF_VAR_stable_tenant_proof_secret_version: ${{ vars.STABLE_TENANT_PROOF_SECRET_VERSION }}
      TF_VAR_authentication_authority: ${{ vars.OIDC_AUTHORITY }}
      TF_VAR_authentication_audience: ${{ vars.OIDC_AUDIENCE }}
      TF_VAR_authentication_browser_client_id: ${{ vars.OIDC_BROWSER_CLIENT_ID }}
      TF_VAR_authentication_browser_authorization_endpoint: ${{ vars.OIDC_BROWSER_AUTHORIZATION_ENDPOINT }}
      TF_VAR_authentication_browser_token_endpoint: ${{ vars.OIDC_BROWSER_TOKEN_ENDPOINT }}
      TF_VAR_authentication_browser_scope: ${{ vars.OIDC_BROWSER_SCOPE }}
      TF_VAR_prefix: ${{ vars.AZURE_PREFIX }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize remote Terraform state
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_oidc=true"
      # The HMAC key is provisioned externally by the approved operator, never by
      # Terraform or through a TF_VAR_* environment variable.
      - name: Fail closed if pinned tenant proof key version is missing or disabled
        env:
          AZURE_PREFIX: ${{ vars.AZURE_PREFIX }}
          TENANT_PROOF_SECRET_VERSION: ${{ vars.TENANT_PROOF_SECRET_VERSION }}
        run: bash scripts/azure/check-tenant-proof-secret.sh "${AZURE_PREFIX}-kv" "$TENANT_PROOF_SECRET_VERSION"
      - name: Fail closed if the stable signing secret version is missing or disabled
        env:
          AZURE_PREFIX: ${{ vars.AZURE_PREFIX }}
          STABLE_TENANT_PROOF_SECRET_VERSION: ${{ vars.STABLE_TENANT_PROOF_SECRET_VERSION }}
        run: bash scripts/azure/check-tenant-proof-secret.sh "${AZURE_PREFIX}-kv" "$STABLE_TENANT_PROOF_SECRET_VERSION"
      - name: Validate approved platform inventory Key Vault version (metadata only)
        env:
          AZURE_PREFIX: ${{ vars.AZURE_PREFIX }}
          PLATFORM_INVENTORY_ENABLED: ${{ inputs.enable_platform_inventory }}
          PLATFORM_INVENTORY_SECRET_VERSION: ${{ vars.PLATFORM_INVENTORY_SECRET_VERSION }}
        run: |
          if [[ "$PLATFORM_INVENTORY_ENABLED" == "true" ]]; then
            bash scripts/azure/check-platform-inventory-secret.sh "${AZURE_PREFIX}-kv" "$PLATFORM_INVENTORY_SECRET_VERSION"
          fi
      # Candidate revisions must get a unique suffix for each immutable commit.
      - name: Pin candidate revision suffix to source commit
        run: echo "TF_VAR_candidate_revision_suffix=r${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Build and push immutable image
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/comuni:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "TF_VAR_image=$IMAGE" >> "$GITHUB_ENV"
      - name: Plan and stage candidate at zero traffic (no automatic promotion)
        env:
          STABLE_REVISION_SUFFIX: ${{ vars.STABLE_REVISION_SUFFIX }}
          STABLE_TENANT_PROOF_SECRET_VERSION: ${{ vars.STABLE_TENANT_PROOF_SECRET_VERSION }}
          CANDIDATE_TENANT_PROOF_SECRET_VERSION: ${{ vars.TENANT_PROOF_SECRET_VERSION }}
          CANDIDATE_TENANT_PROOF_KEY_ID: ${{ vars.TENANT_PROOF_KEY_ID }}
          PLATFORM_INVENTORY_ENABLED: ${{ inputs.enable_platform_inventory }}
          PLATFORM_INVENTORY_SECRET_VERSION: ${{ vars.PLATFORM_INVENTORY_SECRET_VERSION }}
        run: |
          terraform -chdir=infra plan -input=false -out=deploy.tfplan
          # The plan JSON may include DB credentials. Stream it to the gate, never log it.
          terraform -chdir=infra show -json deploy.tfplan | python3 scripts/azure/check-staged-rollout-plan.py \
            --stable-revision "$STABLE_REVISION_SUFFIX" \
            --candidate-revision "$TF_VAR_candidate_revision_suffix" \
            --stable-secret-version "$STABLE_TENANT_PROOF_SECRET_VERSION" \
            --candidate-secret-version "$CANDIDATE_TENANT_PROOF_SECRET_VERSION" \
            --candidate-key-id "$CANDIDATE_TENANT_PROOF_KEY_ID" \
            --inventory-enabled "$PLATFORM_INVENTORY_ENABLED" \
            --inventory-secret-version "$PLATFORM_INVENTORY_SECRET_VERSION"
          terraform -chdir=infra apply -input=false -auto-approve deploy.tfplan
      - name: Verify healthy candidate and unchanged production traffic (read-only)
        env:
          AZURE_PREFIX: ${{ vars.AZURE_PREFIX }}
          STABLE_REVISION_SUFFIX: ${{ vars.STABLE_REVISION_SUFFIX }}
          CANDIDATE_TENANT_PROOF_KEY_ID: ${{ vars.TENANT_PROOF_KEY_ID }}
          CANDIDATE_TENANT_PROOF_SECRET_VERSION: ${{ vars.TENANT_PROOF_SECRET_VERSION }}
        run: |
          python3 scripts/azure/verify-staged-revisions.py \
            --app "${AZURE_PREFIX}-app" \
            --resource-group "${AZURE_PREFIX}-rg" \
            --stable-revision "$STABLE_REVISION_SUFFIX" \
            --candidate-revision "$TF_VAR_candidate_revision_suffix" \
            --expected-image "$TF_VAR_image" \
            --candidate-key-id "$CANDIDATE_TENANT_PROOF_KEY_ID" \
            --candidate-secret-version "$CANDIDATE_TENANT_PROOF_SECRET_VERSION"

