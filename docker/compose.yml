services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: comuni
      POSTGRES_USER: comuni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comuni -d comuni"]
      interval: 5s
      timeout: 3s
      retries: 15
  comuni:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=comuni;Username=comuni;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in docker/.env}"
      Jwt__Issuer: Comuni.Development
      Jwt__Audience: Comuni.Api
      Security__TenantProofKey: "${TENANT_PROOF_KEY:?Set TENANT_PROOF_KEY in docker/.env}"
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  postgres_data:
